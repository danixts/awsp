name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          branch: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        if: steps.semantic.outputs.new_release_published == 'true'
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/aws-profile-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -o dist/aws-profile-linux-arm64 .
          GOOS=darwin GOARCH=amd64 go build -o dist/aws-profile-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -o dist/aws-profile-darwin-arm64 .
          GOOS=windows GOARCH=amd64 go build -o dist/aws-profile-windows-amd64.exe .

      - name: Upload release assets
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semantic.outputs.new_release_git_tag }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
